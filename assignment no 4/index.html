<!DOCTYPE html>
<html>
<head>
    <title>Ganapati Darshan Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Ganapati Darshan Booking</h2>
        <div class="slots">

            <div class="slot">
                <p>8:00 AM - 10:00 AM</p>
                <button onclick="selectSlot('8:00 AM - 10:00 AM')">
                    Book Now
                </button>
            </div>
            <div class="slot">
                <p>4:00 PM - 6:00 PM</p>
                <button onclick="selectSlot('4:00 PM - 6:00 PM')">
                    Book Now
                </button>
            </div>

        </div>
        <h2>Booking Form</h2>
        <form>
            <label>Name:</label>
            <input type="text" id="name" placeholder="Enter your name">
            <label>Mobile Number:</label>
            <input type="text" id="mobile" placeholder="Enter mobile number">
            <label>Number of Visitors:</label>
            <input type="number" id="visitors" min="1" placeholder="Enter visitors">
            <label>Date:</label>
            <input type="date" id="date">
            <label>Time Slot:</label>
            <select id="slot">
                <option value="">Select Slot</option>
                <option>8:00 AM - 10:00 AM</option>
                <option>4:00 PM - 6:00 PM</option>
            </select>
            <button type="button" onclick="bookDarshan()">
                Book Darshan
            </button>

        </form>

        <div id="message"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
