<!DOCTYPE html>
<html>

<head>
    <title>Student Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Student Name -->
    <h3>Name:</h3>
    <input type="text" id="name" placeholder="Enter Name">

    <!-- Student Roll Number -->
    <h3>Roll No:</h3>
    <input type="text" id="roll" placeholder="Enter Roll No">

    <!-- Student Marks -->
    <h3>Marks:</h3>

    <!-- Physics Marks -->
    <input type="text" id="physics" placeholder="Physics">

    <!-- Chemistry Marks -->
    <input type="text" id="chemistry" placeholder="Chemistry">

    <!-- Maths Marks -->
    <input type="text" id="maths" placeholder="Maths">

    <br><br>

    <!-- Submit Button -->
    <button id="btn">Submit</button>

    <!-- Result will be displayed here -->
    <div id="result"></div>

    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
